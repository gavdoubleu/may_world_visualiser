title: ""
theme_name: "Accessible Light"
subtitle: null
logo_path: null

# High-contrast light theme. WCAG AAA on body text.
# Colourblind-safe: teal accent avoids red/green pair (safe for deuteranopia & protanopia).
# Font: Atkinson Hyperlegible — designed for low-vision and dyslexic readers.

colors:
  bg:             '#f5f5f0'
  surface:        '#eeeee8'
  surface_raised: '#e8e8e2'
  border:         '#c8c8bc'
  text:           '#1a1a1a'
  text_muted:     '#555550'
  accent:         '#007a87'
  header_bg:      '#f9c901'
  header_text:    '#000000'
  header_gradient: 'linear-gradient(135deg, #f9c901 0%, #f0bc00 100%)'
  header_border:   'rgba(26, 42, 53, 0.15)'
  header_shadow:   '0 1px 8px rgba(249, 201, 1, 0.30)'

fonts:
  display:      'Atkinson Hyperlegible'
  display_file: 'AtkinsonHyperlegible-Regular.woff2'
  body:         'Atkinson Hyperlegible'
  body_file:    'AtkinsonHyperlegible-Regular.woff2'

base_font_size: 16
explorer_logo: '/static/images/May_world_explorer_dark_logo.svg'
