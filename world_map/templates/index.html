<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map</title>
    <link rel="stylesheet" href="/static/css/vendor/leaflet.css">
    <link rel="stylesheet" href="/api/theme.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/events.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <img id="app-logo" src="{{ logo_url }}" alt="Logo"{% if logo_url %} style="display:block;"{% endif %}>
            <h1 id="app-title"></h1>
            <div id="stats-summary"></div>
        </header>

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebar-section">
                <h3>Geography Levels</h3>
                <div id="geography-levels"></div>
            </div>
            <div class="sidebar-section">
                <h3>Statistics</h3>
                <div id="world-stats"></div>
            </div>
        </div>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Info Panel -->
        <div id="info-panel" class="hidden">
            <button id="close-panel" class="close-btn">&times;</button>
            <div id="info-content"></div>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script src="/static/js/vendor/leaflet.js"></script>
    <script src="/static/js/vendor/proj4.min.js"></script>
    <script src="/static/js/vendor/proj4leaflet.min.js"></script>
    <script>
    (async function applyTheme() {
        try {
            const response = await fetch('/api/theme');
            if (!response.ok) return;
            const theme = await response.json();

            const titleEl = document.getElementById('app-title');
            if (titleEl && theme.title !== undefined) {
                titleEl.textContent = theme.title;
            }

            const logoEl = document.getElementById('app-logo');
            if (logoEl && theme.logo_path) {
                logoEl.src = '/static/' + theme.logo_path;
                logoEl.style.display = 'block';
            }

            if (theme.subtitle) {
                const titleEl2 = document.getElementById('app-title');
                if (titleEl2) {
                    const sub = document.createElement('span');
                    sub.id = 'app-subtitle';
                    sub.style.cssText =
                        'font-size:0.7rem;opacity:0.65;display:block;'
                        + 'letter-spacing:0.08em;margin-top:2px;';
                    sub.textContent = theme.subtitle;
                    titleEl2.appendChild(sub);
                }
            }
        } catch (_) {
            // Flask not reachable — keep default title/logo
        }
    })();
    </script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/panel_navigator.js"></script>
    <script src="/static/js/panel_builders.js"></script>
    <script src="/static/js/geography.js"></script>
    <script src="/static/js/venues.js"></script>
    <script src="/static/js/venue_detail.js"></script>
    <script src="/static/js/people.js"></script>
    <script src="/static/js/cross_nav.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/events.js"></script>
</body>
</html>
