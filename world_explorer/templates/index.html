<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Explorer</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="app">

    <header id="header">
      <div class="header-brand">
        <img src="{{ header_logo }}" alt="World Explorer" class="header-logo">
      </div>
      <div id="header-stats" class="header-stats">Loading…</div>
      <div id="header-search">
        <input id="header-search-input" class="search-input" type="text" placeholder="Search geo unit, person, or venue…" autocomplete="off">
        <button id="header-search-geo-btn" class="icon-btn" title="Go to geo unit">
          <img src="/static/images/to_geo_unit_icon.svg" alt="Go to geo unit">
        </button>
        <button id="header-search-person-btn" class="icon-btn" title="Go to person">
          <img src="/static/images/to_person_logo.svg" alt="Go to person">
        </button>
        <button id="header-search-venue-btn" class="icon-btn" title="Go to venue">
          <img src="/static/images/to_venue_logo.svg" alt="Go to venue">
        </button>
        <div id="header-search-error" class="search-error" hidden></div>
        <ul id="header-search-dropdown" class="search-dropdown" hidden></ul>
      </div>
      <div id="theme-switcher">
        <button id="theme-btn" class="icon-btn" title="Switch theme">
          <img src="/static/images/palette_icon.svg" alt="Switch theme" class="theme-btn-icon">
        </button>
        <ul id="theme-dropdown" class="theme-dropdown" hidden></ul>
      </div>
    </header>

    <div id="main">

      <div id="tree-pane">
        <div class="pane-header">Geography</div>
        <div id="tree-scroll">
          <ul id="geo-tree" class="tree-root"></ul>
        </div>
      </div>

      <div id="detail-pane">
        <div id="unit-placeholder">
          <span>Select a geographic unit from the tree</span>
        </div>
        <div id="unit-detail" hidden>
          <div id="detail-nav-row">
            <button id="nav-back-btn" class="nav-btn" title="Back" disabled>&#8592;</button>
            <button id="nav-fwd-btn"  class="nav-btn" title="Forward" disabled>&#8594;</button>
          </div>
          <div id="unit-title-row"></div>
          <div id="stats-strip-container"></div>
          <div id="distributions-container"></div>
          <div id="venues-container"></div>
          <div id="people-container"></div>
        </div>
      </div>

      <div id="detail-panel">
        <div class="detail-panel__header">
          <button id="panel-back-btn" class="nav-btn" title="Back" disabled>&#8592;</button>
          <button id="panel-fwd-btn"  class="nav-btn" title="Forward" disabled>&#8594;</button>
          <span class="detail-panel__title" id="detail-panel-title">Detail</span>
          <button class="btn-close" id="close-detail-panel" title="Close">&#10005;</button>
        </div>
        <div class="detail-panel__body" id="detail-panel-content"></div>
      </div>

    </div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
